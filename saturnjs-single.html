<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaturnJS - GitHub Repo Indexer</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden;
            background: #1e1e2f;
            color: white;
        }
        #sidebar {
            width: 350px;
            background: #2a2a40;
            border-right: 1px solid #141420;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .controls {
            padding: 20px;
            background: #32324e;
            border-bottom: 1px solid #141420;
        }
        .controls input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #4a4a6a;
            background: #1e1e2f;
            color: white;
            border-radius: 4px;
        }
        .controls button {
            width: 100%;
            padding: 10px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .controls button:hover { background: #4338ca; }
        
        #file-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }
        #file-list li {
            padding: 15px 20px;
            border-bottom: 1px solid #32324e;
            cursor: pointer;
            font-size: 14px;
            word-break: break-all;
            transition: background 0.2s;
        }
        #file-list li:hover { background: #4a4a6a; }
        
        /* Hiding the main area since we open in new tabs */
        #main-area {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="controls">
            <h2 style="margin-top:0;">SaturnJS Indexer</h2>
            <label>GitHub Owner / Org:</label>
            <input type="text" id="owner" value="Jack105WA">
            
            <label>Repository Name:</label>
            <input type="text" id="repo" value="gams">
            
            <label>Branch:</label>
            <input type="text" id="branch" value="main">
            
            <button onclick="indexRepository()">Fetch Repository</button>
        </div>
        
        <ul id="file-list">
            <li style="color: #a1a1aa; text-align: center; padding-top: 20px;">
                Click "Fetch Repository" to load
            </li>
        </ul>
    </div>

    <div id="main-area">
        <h1>SaturnJS</h1>
        <p style="color: #a1a1aa; max-width: 400px;">
            Select a file from the sidebar. It will be fetched directly from GitHub and executed safely in a new <b>about:blank</b> tab.
        </p>
    </div>

    <script>
        const ownerInput = document.getElementById('owner');
        const repoInput = document.getElementById('repo');
        const branchInput = document.getElementById('branch');
        const fileList = document.getElementById('file-list');

        async function indexRepository() {
            const owner = ownerInput.value.trim();
            const repo = repoInput.value.trim();
            const branch = branchInput.value.trim() || 'main';
            
            if(!owner || !repo) return alert("Please enter owner and repository.");

            fileList.innerHTML = "<li style='color: #4f46e5;'>Fetching repo index...</li>";

            try {
                const treeUrl = `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;
                const response = await fetch(treeUrl);
                
                if (!response.ok) throw new Error(`API Error ${response.status}`);
                
                const data = await response.json();
                
                // Exclude saturnjs-single.html from the list so you don't open the indexer inside the indexer
                const htmlFiles = data.tree.filter(item => 
                    item.type === 'blob' && 
                    item.path.endsWith('.html') && 
                    !item.path.includes('saturnjs-single.html')
                );
                
                fileList.innerHTML = ""; 
                
                if (htmlFiles.length === 0) {
                    fileList.innerHTML = "<li>No other HTML files found.</li>";
                    return;
                }

                htmlFiles.forEach(file => {
                    const li = document.createElement('li');
                    li.textContent = file.path;
                    
                    const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${file.path}`;
                    
                    li.onclick = () => loadInNewTab(rawUrl);
                    fileList.appendChild(li);
                });

            } catch (error) {
                fileList.innerHTML = `<li style="color:#ff6b6b;">Failed: ${error.message}</li>`;
            }
        }

        async function loadInNewTab(rawUrl) {
            try {
                const response = await fetch(rawUrl);
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                const htmlText = await response.text();
                
                // Create a new about:blank tab
                const newTab = window.open('about:blank', '_blank');
                
                // Inject the fetched HTML into the new tab
                newTab.document.open();
                newTab.document.write(htmlText);
                newTab.document.close();
                
                // Attempt to set the title of the new tab
                setTimeout(() => {
                    if(newTab.document.title === "") {
                        newTab.document.title = "SaturnJS - Loaded File";
                    }
                }, 100);

            } catch (error) {
                alert(`Failed to load content: ${error.message}`);
            }
        }
    </script>
</body>
</html>
